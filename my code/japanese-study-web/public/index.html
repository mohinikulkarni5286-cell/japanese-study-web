<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Japanese Study Tracker</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Japanese Study Tracker</h1>

      <section class="card">
        <h2>Add Vocabulary</h2>
        <form id="vocab-form">
          <input id="word-input" type="text" placeholder="Enter a Japanese word" />
          <button type="submit">Add</button>
        </form>
      </section>

      <section class="card">
        <h2>Today's Progress</h2>
        <p id="daily-count">Learned today: 0</p>
      </section>

      <section class="card">
        <h2>Vocabulary List</h2>
        <ul id="vocab-list"></ul>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
