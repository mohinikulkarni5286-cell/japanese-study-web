<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Japanese Study Tracker Application</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Japanese Study Tracker</h1>

      <section class="card">
        <h2>Add Vocabulary</h2>
        <form id="vocab-form">
          <input id="word-input" type="text" placeholder="Enter a Japanese word" />
          <button type="submit">Add</button>
        </form>
      </section>

      <section class="card">
        <h2>Today's Progress</h2>
        <p id="daily-count">Learned today: 0</p>
      </section>

      <section class="card">
        <h2>Vocabulary</h2>
        <div class="tabs" role="tablist" aria-label="Vocabulary tabs">
          <button type="button" class="tab-btn active" data-tab="vocab-list-panel" aria-selected="true">Vocabulary List</button>
          <button type="button" class="tab-btn" data-tab="added-items-panel" aria-selected="false">Added Items</button>
        </div>
        <div id="vocab-list-panel" class="tab-panel active" role="tabpanel">
          <ul id="vocab-list"></ul>
        </div>
        <div id="added-items-panel" class="tab-panel" role="tabpanel" aria-hidden="true">
          <ul id="added-items-list"></ul>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
